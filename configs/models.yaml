# The three encoders in the primary matrix (plan §7.3). Used by run_matrix.py.
models:
  berturk: dbmdz/bert-base-turkish-cased       # monolingual Turkish (main)
  mbert:   bert-base-multilingual-cased         # multilingual baseline
  xlmr:    xlm-roberta-base                      # strong multilingual baseline

# Optional extra encoders to broaden RQ3 (opt in: --models berturk convberturk ...).
extra_models:
  convberturk: dbmdz/convbert-base-turkish-cased   # 2nd monolingual Turkish
  mdeberta:    microsoft/mdeberta-v3-base           # stronger multilingual

# Default sweep uses the three empirically-distinct schemes. 'whitespace' is
# dropped from the default because it produces identical tokenization to 'native'
# for all three encoders on MASSIVE-tr (0% divergence; see results/tokenizer_metrics.md);
# add it back to confirm the equivalence if desired.
segmentations: [native, morphological, char]
# also available: whitespace, morphological-zeyrek
seeds: [42, 123, 2024]
