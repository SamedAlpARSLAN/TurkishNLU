[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turkish-nlu-segmentation"
version = "0.1.0"
description = "Segmentation strategies for Turkish joint intent detection and slot filling (AIST 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "torch>=2.1",
  "transformers>=4.35,<5",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "seqeval>=1.2.2",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "requests>=2.31",
  "morfessor>=2.0.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# High-signal correctness checks (pyflakes, syntax, warnings); not style churn.
select = ["F", "E9", "W"]
